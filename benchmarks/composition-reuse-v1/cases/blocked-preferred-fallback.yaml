schema_version: '1'
name: blocked-preferred-fallback
goal: Prefer a qualified alternative when the highest-priority implementation carries an explicit block,
  and never select the blocked entry silently.
mode: calibration
external_input: grounded-research-request/v1
required_output: grounded-research-response/v1
required_capabilities:
- grounded-research-synthesis
allowed_licenses:
- Apache-2.0
allowed_integrations:
- command-json
minimum_evidence_level: 2
contracts:
- contract_id: grounded-research-request/v1
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - schema_version
    - request_id
    - question
    - documents
    properties:
      schema_version:
        const: '1'
      request_id:
        type: string
        minLength: 1
      question:
        type: string
        minLength: 3
      minimum_sources:
        type: integer
        minimum: 1
      documents:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - document_id
          - title
          - full_text
          properties:
            document_id:
              type: string
              minLength: 1
            title:
              type: string
              minLength: 1
            full_text:
              type: string
              minLength: 1
- contract_id: grounded-research-response/v1
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - schema_version
    - request_id
    - status
    - answer
    - claims
    - sources
    properties:
      schema_version:
        const: '1'
      request_id:
        type:
        - string
        - 'null'
      status:
        enum:
        - answered
        - abstained
      answer:
        type: string
      claims:
        type: array
      sources:
        type: array
- contract_id: literature-brief/v1
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - topic
    properties:
      topic:
        type: string
        minLength: 3
