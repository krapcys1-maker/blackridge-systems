    artifact_sha256: 96b0ec57cf4ca4ccaa272e46cdb33c96028fbb3f9ace6e9b6ee583becb7eb168
    working_directory: '{definition_dir}'
    timeout_seconds: 60
    environment_allowlist: []
  evidence:
    level: 0
  selection_priority: 10
