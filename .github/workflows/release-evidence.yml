name: release-evidence

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install -e ".[dev]"
      - name: Verify generated notices
        run: blackridge compliance-notices --check
      - name: Build wheel and source distribution
        run: python -m build
      - name: Inspect exact wheel bytes
        run: >-
          blackridge probe-wheel-release
          "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          --output-directory release-evidence/wheel
      - name: Build the declared runtime image
        run: >-
          docker build
          --tag blackridge/swerex-runtime:release-candidate
          --file docker/swerex-runtime.Dockerfile .
      - name: Resolve immutable local image ID
        id: image
        run: echo "id=$(docker image inspect --format '{{.Id}}' blackridge/swerex-runtime:release-candidate)" >> "$GITHUB_OUTPUT"
      - name: Inspect exact image bytes
        id: image_probe
        continue-on-error: true
        run: >-
          blackridge probe-image-release
          "${{ steps.image.outputs.id }}"
          --output-directory release-evidence/image
      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blackridge-release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce image release gate
        if: steps.image_probe.outcome != 'success'
        run: |
          echo "Image compliance probe reported unresolved release blockers."
          echo "Inspect the uploaded image/probe.json before publication."
          exit 1
