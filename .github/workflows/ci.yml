name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            package: false
          - os: ubuntu-latest
            python-version: "3.12"
            package: true
          - os: windows-latest
            python-version: "3.12"
            package: false
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0"
          python -m pip install -e ".[dev]"
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Verify canonical formatting
        run: ruff format --check src tests tools components
      - name: Type-check production source
        run: mypy src/blackridge
      - name: Compile source and tests
        run: python -m compileall -q src tests tools components
      - name: Scan Python source for medium and high severity issues
        run: bandit -r src -ll -ii
      - name: Audit the exact resolved Python environment
        run: pip-audit --local --skip-editable
      - name: Verify generated third-party notices
        run: blackridge compliance-notices --check
      - name: Enforce declared copy provenance
        run: blackridge check-provenance provenance/derived-code.yaml
      - name: Test
        run: pytest --cov=blackridge --cov-report=term-missing --cov-fail-under=70
      - name: Build exact distribution artifacts
        if: matrix.package
        run: python -m build --outdir ci-dist
      - name: Validate distribution metadata and README rendering
        if: matrix.package
        run: twine check ci-dist/*

  system-e2e:
    name: system-e2e / ubuntu-24.04 / python-3.12 / docker
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated build tooling
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0"
          python -m pip install "build>=1,<2" "twine==7.0.0"
      - name: Build and validate exact distribution artifacts
        run: |
          python -m build --outdir "$RUNNER_TEMP/blackridge-system-dist"
          twine check "$RUNNER_TEMP"/blackridge-system-dist/*
      - name: Install wheel with system extras in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/blackridge-system-runtime"
          wheel="$(find "$RUNNER_TEMP/blackridge-system-dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          "$RUNNER_TEMP/blackridge-system-runtime/bin/python" -m pip install \
            "$wheel[sandbox,supply-chain]"
          "$RUNNER_TEMP/blackridge-system-runtime/bin/python" -m pip check
      - name: Verify installed optional-tool resolution
        run: |
          "$RUNNER_TEMP/blackridge-system-runtime/bin/python" - <<'PY'
          from blackridge.supply_chain import _pypi_attestation_verifier

          executable, version = _pypi_attestation_verifier()
          assert executable is not None, "installed pypi-attestations entrypoint was not resolved"
          assert version == "0.0.30", version
          print(f"Resolved pypi-attestations {version}: {executable}")
          PY
      - name: Build the pinned sandbox runtime image
        run: >-
          docker build
          --tag blackridge/swerex-runtime:1.4.0
          --file docker/swerex-runtime.Dockerfile .
      - name: Run installed-wheel system E2E and fail-closed controls
        run: >-
          python tools/system_e2e.py
          --repository "$GITHUB_WORKSPACE"
          --work-directory "$RUNNER_TEMP/blackridge-system-e2e"
          --blackridge "$RUNNER_TEMP/blackridge-system-runtime/bin/blackridge"
          --image blackridge/swerex-runtime:1.4.0
      - name: Upload system E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blackridge-system-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blackridge-system-e2e/
            ${{ runner.temp }}/blackridge-system-dist/
          if-no-files-found: error
          retention-days: 14
