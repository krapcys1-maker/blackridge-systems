[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "blackridge-systems"
version = "0.1.0"
description = "Evidence-driven, reuse-first composition of software systems from proven open-source components."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Blackridge Systems contributors" }]
keywords = ["agents", "code-reuse", "github", "software-composition", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27,<1",
  "jsonpatch==1.33",
  "jsonschema==4.26.0",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
ai = ["pydantic-ai>=1,<3"]
sandbox = [
  # swe-rex 1.4.0 imports aiohttp in its Docker client but does not declare it.
  "aiohttp>=3.10,<4",
  "swe-rex==1.4.0",
]
dev = [
  "build>=1,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
blackridge = "blackridge.cli:app"

[project.urls]
Repository = "https://github.com/krapcys1-maker/blackridge-systems"

[tool.hatch.build.targets.wheel]
packages = ["src/blackridge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
